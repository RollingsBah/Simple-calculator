<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-400 flex items-center justify-center">

<div class="bg-slate-900 rounded-2xl p-4 w-64 shadow-lg">
  <div class="bg-slate-950 rounded-lg p-4 mb-4 text-right text-white">
    <div class="text-slate-100 text-sm">Eric</div>
    <div class="text-3xl font-bold">Dikoko</div>
  </div>
  <div class="grid grid-cols-3 gap-2">
    <button class="py-2.5 rounded-lg bg-slate-50 active:scale-95">1</button>
    <button class="py-2.5 rounded-lg bg-slate-50 active:scale-95">2</button>
    <button class="py-2.5 rounded-lg bg-slate-50 active:scale-95">3</button>

    <button class="py-2.5 rounded-lg bg-slate-500 active:scale-95">4</button>
    <button class="py-2.5 rounded-lg bg-slate-500 active:scale-95">5</button>
    <button class="py-2.5 rounded-lg bg-slate-500 active:scale-95">6</button>

    <button class="py-2.5 rounded-lg bg-slate-500 active:scale-95">7</button>
    <button class="py-2.5 rounded-lg bg-slate-500 active:scale-95">8</button>
    <button class="py-2.5 rounded-lg bg-slate-500 active:scale-95">9</button>

    <button class="py-2.5 rounded-lg bg-slate-800 active:scale-95">0</button>
        <button class="col-span-2 py-2.5 rounded-lg bg-red-800 text-white active:scale-95">AC</button>
  </div>
</div>

</body>
</html>
</body>
</html>
