<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculator</title>

<!-- Links the CSS file for styling -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Main calculator container -->
<div class="calculator">
    
    <div class="number-section">

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('6')">6</button>

        <button onclick="appendValue('9')">9</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('7')">7</button>

        <!-- Calculates the expression -->
        <button class="equal" onclick="calculate()">=</button>

        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('8')">8</button>

    </div>
    <!-- Displays the input and result -->
    <input type="text" id="display" readonly>

    <!-- Operator buttons -->
    <div class="operators">

        <button onclick="appendValue('+')">+</button>
        <button onclick="appendValue('-')">-</button>
        <button onclick="appendValue('/')">/</button>
        <button onclick="appendValue('*')">*</button>
        <!-- clear -->
        <button onclick="clearDisplay()">AC</button>
        <button class="del_btn" onclick="deleteLast()">DEL</button>

        <button onclick="appendValue('%')">%</button>
        <button onclick="appendValue('^')">^</button>

        <button onclick="decimal()">.</button>

        <!-- Square Root -->
        <button onclick="squareRootValue()">√</button>

        <button onclick="decimalToFraction()">a/b</button>

        <button onclick="appendValue('(')">(</button>
        <button onclick="appendValue(')')">)</button>

        <!-- Combination -->
        <button onclick="appendValue('C')">C</button>

        <!-- Quadratic Equation Buttons -->
        <button onclick="appendValue('x')">x</button>

        <button onclick="appendValue('x²')">x²</button>

        <button onclick="appendValue('eq')">eq</button>
        
        <!-- history actions -->    
        <button onclick="clearedHistory()">cleared</button>
        <button onclick="saveHistory()">saved</button>
        <button onclick="retrievehistory()">retrieved</button>
        <button onclick="previewHistory()">preview</button>
    </div>

</div>

<!-- Links the JavaScript file -->
<script src="script.js"></script>

</body>
